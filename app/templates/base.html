<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Verified Asset{% endblock %}</title>
{% block head %}{% endblock %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root { --paper:#f6f2ea; --ink:#1d1b18; --muted:#6b645a; --line:#d8d0c2; --card:#fffdf8;
  --ok:#1f7a4d; --ok-bg:#e3f2e8; --bad:#b3261e; --bad-bg:#fbe5e2; --maybe:#8a5a00; --maybe-bg:#fbefd3; }
@media (prefers-color-scheme: dark) { :root { --paper:#16140f; --ink:#f1ece2; --muted:#a69d8f; --line:#3a352c;
  --card:#1f1c16; --ok:#6fd39c; --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1714; --maybe:#f2c46b; --maybe-bg:#3a2c0e; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
h1, h2 { font-family: Fraunces, Georgia, serif; line-height: 1.15; }
h1 { font-size: 2rem; margin: .4em 0; } h2 { font-size: 1.35rem; margin: 1.6em 0 .5em; }
.demo { background: var(--ink); color: var(--paper); font-size: .8rem; text-align: center; padding: 6px 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 12px 0; }
.muted { color: var(--muted); } .mono { font-family: "JetBrains Mono", monospace; font-size: .8rem; word-break: break-all; }
.chip { display:inline-block; font-size:.75rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  padding: 2px 8px; border-radius: 99px; }
.supported { color: var(--ok); background: var(--ok-bg); } .contradicted { color: var(--bad); background: var(--bad-bg); }
.inconclusive { color: var(--maybe); background: var(--maybe-bg); }
button, .button { font: inherit; font-weight: 600; background: var(--ink); color: var(--paper); border: 0;
  border-radius: 8px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
input, select, textarea { font: inherit; width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--card); color: var(--ink); }
.row { display: grid; grid-template-columns: 1.1fr 2fr 1fr .8fr; gap: 6px; margin: 6px 0; }
@media (max-width: 600px) { .row { grid-template-columns: 1fr 1fr; } }
.claim { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; padding: 10px 0;
  border-top: 1px solid var(--line); }
.claim:first-child { border-top: 0; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.slots img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; background: var(--line); }
.code { font-family: "JetBrains Mono", monospace; font-size: 1.6rem; letter-spacing: .3em; }
.state { padding: 12px 16px; border-radius: 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="demo">Hackathon demo · independent project, not affiliated with Meta or Facebook Marketplace</div>
<main>{% block main %}{% endblock %}</main>
</body>
</html>
